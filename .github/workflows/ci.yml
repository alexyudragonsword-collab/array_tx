name: CI

on:
  push:
  pull_request:

jobs:
  # Static checks, pinned (pyproject [dev]): an unpinned linter can turn CI
  # red on code that did not change.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[test]
      - name: Test
        # the example smoke runs are the examples job's (same three Pythons, in parallel)
        run: pytest tests/ -q -m "not examples"

  # The examples are the library's worked documentation; nothing else
  # exercises them end to end.  ARRAYTX_SMOKE=1 shortens the bursts so the
  # whole set fits a CI job; the full-size numbers live in cairn/LOG.md.
  # Each example runs once per Python, beside the unit tests rather than inside
  # them (it used to run four times: here and in each test job).  The pytest
  # wrapper also checks that every example prints its engine line and plots.
  examples:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      ARRAYTX_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[test]
      - name: Run every example (smoke size)
        run: pytest tests/test_examples.py -q -m examples --durations=5

  # Vendor drift: src/arraytx/vendor must still match the pinned upstreams.
  # Siblings are checked out at the pinned FULL SHA with full history, so a
  # pin is never "stale" relative to its own checkout and --strict is safe:
  # it turns any skipped (unverifiable) file red, which is the point.
  # The page in a real Chromium against the real host (tests/test_webui.py).
  # On a laptop without Playwright those tests skip; here the skip is a
  # failure (ARRAYTX_REQUIRE_BROWSER=1) so a green run that tested nothing
  # cannot pass for one that did.
  test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the page-test extra and a Chromium
        run: |
          pip install -e ".[gui-test]"
          python -m playwright install --with-deps chromium
      - name: Page tests (real browser, real host)
        env:
          ARRAYTX_REQUIRE_BROWSER: "1"
          ARRAYTX_SMOKE: "1"
        run: pytest -q tests/test_webui.py tests/test_webhost.py tests/test_guispec.py tests/test_guiutil.py

  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: array_tx
      - name: Checkout polar_tx (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/polar_tx
          ref: b007e60477bac68806138db733cbafd0c0761282
          fetch-depth: 0
          path: _siblings/polar_tx
      - name: Checkout PA_DPD (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/PA_DPD
          ref: 08b9725595748b290c76d1b70355f7e6014a709e
          fetch-depth: 0
          path: _siblings/PA_DPD
      - name: Checkout pll_simulator (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/pll_simulator
          ref: 5564c6430279036a78eea6829f4fecb13adac233
          fetch-depth: 0
          path: _siblings/pll_simulator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vendor drift check
        working-directory: array_tx
        run: >
          python tools/vendor_check.py
          --strict
          --siblings
          polar_tx=${{ github.workspace }}/_siblings/polar_tx
          PA_DPD=${{ github.workspace }}/_siblings/PA_DPD
          pll_simulator=${{ github.workspace }}/_siblings/pll_simulator
