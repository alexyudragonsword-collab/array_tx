name: CI

on:
  push:
  pull_request:

jobs:
  # Static checks, pinned (pyproject [dev]): an unpinned linter can turn CI
  # red on code that did not change.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[test]
      - name: Test
        run: pytest tests/ -q

  # The examples are the library's worked documentation; nothing else
  # exercises them end to end.  ARRAYTX_SMOKE=1 shortens the bursts so the
  # whole set fits a CI job; the full-size numbers live in cairn/LOG.md.
  examples:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      ARRAYTX_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run every example (smoke size)
        run: |
          fail=0
          for f in examples/ex*.py; do
            echo "::group::$f"
            if python "$f"; then echo "OK $f"; else echo "FAILED $f"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  # Vendor drift: src/arraytx/vendor must still match the pinned upstreams.
  # Siblings are checked out at the pinned FULL SHA with full history, so a
  # pin is never "stale" relative to its own checkout and --strict is safe:
  # it turns any skipped (unverifiable) file red, which is the point.
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: array_tx
      - name: Checkout polar_tx (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/polar_tx
          ref: 008cc90baf180b5519453ffdecf15d20ff51582d
          fetch-depth: 0
          path: _siblings/polar_tx
      - name: Checkout PA_DPD (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/PA_DPD
          ref: 08b9725595748b290c76d1b70355f7e6014a709e
          fetch-depth: 0
          path: _siblings/PA_DPD
      - name: Checkout pll_simulator (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/pll_simulator
          ref: 00e48a2f6f7c11c0b6f106234f1490493d43e082
          fetch-depth: 0
          path: _siblings/pll_simulator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vendor drift check
        working-directory: array_tx
        run: >
          python tools/vendor_check.py
          --strict
          --siblings
          polar_tx=${{ github.workspace }}/_siblings/polar_tx
          PA_DPD=${{ github.workspace }}/_siblings/PA_DPD
          pll_simulator=${{ github.workspace }}/_siblings/pll_simulator
