name: Android APK

# Manual only: a Chaquopy build downloads an SDK, a CPython and native wheels
# per ABI -- real runner minutes -- and the APK is a sideload artifact, not a
# release gate.  The bridge and the page are tested on every push without
# Android (tests/test_appbridge.py, tests/test_android.py, tests/test_webui.py).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"       # must match chaquopy.version in android/app/build.gradle.kts
      - name: Install build tools
        run: pip install build
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      - name: Build the arraytx sdist the app embeds
        run: python -m build --sdist --outdir android/app/pysrc .
      - name: Build the APK
        run: gradle -p android :app:assembleDebug
      - name: Check the page went in as assets
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/www/(index.html|app.js|charts.js|style.css)" | wc -l | grep -qx 4
      - uses: actions/upload-artifact@v4
        with:
          name: arraytx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
