# Regression anchor: one element, sub-6 (polar_tx nr_dtc FR1 default), S = 0,
# element errors off, polar_tx's default DPA.  Must equal one polar_tx chain bit for bit.
arraytx_config: 1
seed: 1
standard: sub6_nr100
array:
  n_elements: 1
  spacing_lambda: 0.5
  element_pattern: isotropic
element:
  topology: polar
  errors:
    enabled: false
    gain_sigma_db: 0.5
    phase_sigma_deg: 5.0
    delay_sigma_ps: 2.0
    pa_dev_sigma: 0.05
  pa:
    n_bits: 10
    n_thermo: 6
    sigma_cell: 0.002
    amam: ideal
    rapp_p: 2.0
    rapp_drive: 1.0
    ampm_deg_at_fs: 0.0
  lo:
    shared: true
    clock_profile: null
    loop_bw_hz: 400000.0
coupling:
  source: analytic
  scale_db: -inf
  analytic:
    c1_db: -16.0
    c1_deg: 180.0
    c2_rel_db: -6.0
  survey:
    c1_db:
      value: -16.0
      source: survey
      ref: abstract-level only (full texts unreachable from the build environment, see ROADMAP A1); arXiv:2407.09944 — 28 GHz FR-2 linear patch array, elements at ~lambda0/2, CATR OTA measurements; adjacent coupling in the -13..-16 dB class for uncompensated lambda/2 patches; US patent 10910732 — 28 GHz array, measured mutual coupling better than -16 dB; Int. J. Electron. Commun. (ScienceDirect S1434841126001263) — lambda/2 (5.4 mm) SIW endfire array, adjacent coupling below -15 dB in the lower band
    c1_deg_at_f0:
      value: 180.0
      source: survey
      ref: 'sign convention only: the adjacent coupled wave arrives half a wavelength (pi) later at f0 for lambda/2 pitch; the papers above do not publish the phase'
    c2_rel_db:
      value: -6.0
      source: survey
      ref: next-adjacent coupling 6 dB below adjacent is the common reading of published S-parameter plots for lambda/2 patch rows (free-space 1/r over twice the distance); no paper-level number
    path_delay_from_spacing: true
  touchstone:
    path: null
beam:
  steering: phase
  scan_deg:
  - 0.0
  sidelobe: auto
dpd:
  scheme: none
  n_iterations: 2
  regularization: 1.0e-09
  gmp:
    order: 5
    memory_depth: 3
    lag_order: 1
    lag_memory: 2
    lag_span: 1
    lead_order: 0
    lead_memory: 0
    lead_span: 0
  per_element_observe: pa_output
metrics:
  aclr_offsets:
  - 1
  - 2
  evm_equalize: scalar
sim:
  n_symbols: 8
  smoke_n_symbols: 2
  noise: true
  cfr_papr_db: 8.5
